server {
    listen 8088;
    listen [::]:8088;

    server_name 103.178.235.64;

    access_log /var/log/nginx/vitrungquy-k24cntt3-access.log;
    error_log /var/log/nginx/vitrungquy-k24cntt3-error.log;

    location / {
        allow all;
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}